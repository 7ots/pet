<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7ots</title>
<style>
  :root {
    --ink: #17141f; --ink-2: #4a4458; --muted: #8a8399; --bg: #f3f1f8; --panel: #ffffff; --panel-2: #f8f7fb;
    --line: #e8e4f0; --accent: #6d5dfc; --accent-ink: #fff; --ok: #12a150; --warn: #e08a00; --err: #e5484d;
    --shadow: 0 1px 2px rgb(20 16 40 / .06), 0 12px 40px -12px rgb(20 16 40 / .18);
    --r: 18px; color-scheme: light;
    --font: ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2f0f8; --ink-2: #c9c3d6; --muted: #8d86a0; --bg: #0f0d14; --panel: #18151f; --panel-2: #1e1a27; --line: #2a2535; --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 18px 50px -16px rgb(0 0 0 / .7); color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font: 14px/1.45 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  body { display: grid; place-items: start center; padding: 24px 16px; }
  button { font: inherit; color: inherit; }
  svg { display: block; }

  .app { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; letter-spacing: -.01em; }
  .brand i { width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: var(--panel); display: grid; place-items: center; font: 800 10px/1 var(--font); font-style: normal; }
  .sp { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .live.on::before { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }

  /* stage */
  .hero { position: relative; padding: 64px 20px 18px; display: grid; justify-items: center;
    background: radial-gradient(120% 80% at 50% 38%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
  .stage { position: relative; width: 168px; height: 176px; }
  .face { position: relative; z-index: 1; width: 100%; height: 100%; transition: transform .3s; }
  .floor { position: absolute; left: 50%; bottom: 2px; width: 110px; height: 14px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgb(0 0 0 / .18), transparent); }
  .bubble { position: absolute; z-index: 4; /* above the 3D ot's canvas (z 3): under it the ot covered the bubble */ left: 50%; bottom: calc(100% - 4px); width: max-content; max-width: min(300px, 86vw); padding: 10px 14px; border-radius: 16px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13.5px; line-height: 1.4; text-align: left;
    opacity: 0; transform: translate(-50%, 6px) scale(.97); transform-origin: 50% 100%; transition: opacity .22s, transform .22s; pointer-events: none; }
  .bubble.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .bubble::after { content: ''; position: absolute; left: 50%; top: 100%; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: inherit; border: inherit; border-width: 0 1px 1px 0; transform: rotate(45deg); }
  .bubble.asking { pointer-events: auto; -webkit-app-region: no-drag; border-color: var(--accent); }
  .bubble .q { display: block; margin-bottom: 8px; }
  .bubble .shot { display: block; width: 132px; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; margin-bottom: 6px; border: 1px solid var(--line); } /* what it saw when you asked it to look at you */
  .bubble .yn { display: flex; gap: 6px; justify-content: flex-end; }
  .bubble .yn button { font: inherit; font-size: 12.5px; font-weight: 650; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .bubble .yn button.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .bubble .yn button:hover { filter: brightness(1.08); }
  .dots { display: inline-flex; gap: 4px; padding: 2px 0; }
  .dots b { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite ease-in-out; }
  .dots b:nth-child(2) { animation-delay: .15s; } .dots b:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 80%, 100% { opacity: .3; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }
  body.asleep .face { filter: saturate(.6) brightness(.95); }
  .zz { position: absolute; right: 8px; top: 6px; font: 700 15px var(--font); color: var(--muted); opacity: 0; }
  body.asleep .zz { opacity: 1; animation: zz 2.4s infinite ease-in-out; }
  @keyframes zz { 50% { transform: translate(4px, -6px); opacity: .5; } }

  .who { text-align: center; margin-top: 10px; }
  h1 { margin: 0; font-size: 22px; line-height: 1.15; font-weight: 750; letter-spacing: -.025em; }
  .sub { margin-top: 4px; display: flex; gap: 8px; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .cardlink { text-decoration: none; cursor: pointer; }
  .cardlink:hover { border-color: var(--accent); }
  .cardlink svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .mood { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 12px; font-weight: 600; }
  .mood::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--mood, var(--muted)); }

  /* level */
  .level { padding: 14px 18px 4px; }
  .level-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .level-h b { color: var(--ink); font-size: 13px; }
  .track { height: 6px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
  .track > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .5s cubic-bezier(.2, .8, .2, 1); }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 18px 4px; }
  .stat { padding: 10px 10px 11px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
  .stat-h { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .stat-h svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stat-v { font-size: 18px; font-weight: 750; letter-spacing: -.02em; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
  .stat .track { height: 4px; border: 0; background: var(--line); }
  .stat .track > span { background: var(--ok); }
  .stat.mid .track > span { background: var(--warn); } .stat.low .track > span { background: var(--err); }
  .stat.low .stat-v { color: var(--err); }

  /* actions */
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 18px 16px; }
  .act { display: flex; align-items: center; justify-content: center; gap: 7px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 650; font-size: 13px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
  a.act { color: inherit; text-decoration: none; -webkit-app-region: no-drag; }
  .act svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .act:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  .act:active { transform: scale(.97); }
  .act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .act.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }

  /* activity */
  .feed { border-top: 1px solid var(--line); padding: 12px 18px 6px; }
  .feed-h { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .feed-h h2 { margin: 0; font: inherit; }
  .feed-h #tally { letter-spacing: 0; text-transform: none; font-weight: 500; font-variant-numeric: tabular-nums; }
  .feed ol { list-style: none; margin: 0; padding: 0; max-height: 196px; overflow: auto; }
  .feed li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; animation: in .3s ease-out; }
  .feed li:last-child { border-bottom: 0; }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
  .ico { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--panel-2); color: var(--ink-2); }
  .ico svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ok .ico { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .bad .ico { background: color-mix(in srgb, var(--err) 14%, transparent); color: var(--err); }
  .feed .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .feed .txt code { font: 12px var(--mono); color: var(--ink); }
  .feed time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px 0 10px; }

  .foot { display: flex; gap: 6px 12px; flex-wrap: wrap; justify-content: space-between; padding: 10px 18px 14px; color: var(--muted); font-size: 11.5px; border-top: 1px solid var(--line); background: var(--panel-2); }
  .foot b { color: var(--ink-2); font-weight: 600; }

  .ask { display: flex; width: 100%; margin: 4px 0 2px; }
  .ask input { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: inherit; font-size: 13px; outline: none; }
  .ask input:focus { border-color: var(--accent); }
  /* ── desktop: transparent frameless window walking along the bottom of the screen ── */
  html:has(body.desktop:not(.opaque)) { background: transparent; } /* html also paints --bg: without this the window is a white box */
  body.desktop { background: transparent; padding: 0; place-items: end center; height: 100vh; overflow: hidden; user-select: none; } /* dragged by hand (see 'drag' below): a drag region would swallow clicks and double clicks */
  body.desktop .app { width: 100%; background: transparent; border: 0; box-shadow: none; border-radius: 0; overflow: visible; }
  body.desktop .top, body.desktop .who, body.desktop .level, body.desktop .stats, body.desktop .feed, body.desktop .foot { display: none; }
  body.desktop .hero { background: none; padding: 0 0 6px; }
  body.desktop .stage { width: calc(140px * var(--pet-scale, 1)); height: calc(148px * var(--pet-scale, 1)); } /* stretched from a corner (see 'resize' below) */
  body.desktop .stage.flip .face { transform: scaleX(-1); }
  /* the 3D ot is framed with room under its feet (~34px at 1x) that grows with the stretch: the figure is drawn
     lower by what that room grew, so a bigger ot still stands where it stood; the stage (hit area) stays put */
  body.desktop.ot3d .face { top: calc(34px * (var(--pet-scale, 1) - 1)); }
  body.desktop.ot3d .bubble { bottom: calc(100% + 8px); } /* the 3D head reaches the stage's top edge */
  /* scenes with other ots (electron/director.cjs): the acts move .act; props (fireballs, beams, sabers, bullets) */
  .actor { position: absolute; inset: 0; z-index: 1; transform-origin: 50% 92%; }
  .props { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: visible; }
  .props > * { position: absolute; }
  .props .ball { left: 50%; top: 42%; width: 34px; height: 34px; margin: -17px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fff 0 18%, #8fe3ff 30%, #2a7bff 62%, transparent 72%); box-shadow: 0 0 22px 8px #4cb8ff; }
  .props .beam { left: 50%; top: 40%; height: 26px; margin-top: -13px; border-radius: 13px; background: linear-gradient(180deg, #bfefff, #fff 45%, #fff 55%, #7fd6ff); box-shadow: 0 0 24px 10px #49b6ff, 0 0 60px 18px #1f6bff88; }
  .props .bullet { top: 34%; width: 14px; height: 6px; margin-top: -3px; border-radius: 3px; background: linear-gradient(90deg, #6b5a2b, #e9cf7a); }
  .props .ring { top: 34%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; border: 2px solid rgb(180 220 255 / .8); }
  .props .saber { left: 50%; top: 50%; width: 6px; height: 92px; margin-left: -3px; transform-origin: 50% 100%; border-radius: 4px; background: #fff; }
  .props .flash { top: 44%; width: 30px; height: 30px; margin: -15px; border-radius: 50%; background: radial-gradient(#fff, #ffd35a 40%, #ff7a1a 60%, transparent 70%); }
  /* entrances (wrestling style): spotlights from above, pyro columns, the name slammed in */
  .props .spot { left: 50%; bottom: 0; width: 120px; height: 140%; margin-left: -60px; transform-origin: 50% 0; top: -40%; background: linear-gradient(180deg, rgb(255 250 220 / .0), rgb(255 250 220 / .32) 70%, rgb(255 250 220 / .0)); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); filter: blur(2px); mix-blend-mode: screen; }
  .props .spot.rock { animation: rockhue 1s linear infinite; }
  @keyframes rockhue { from { filter: blur(2px) hue-rotate(0deg) saturate(4); } to { filter: blur(2px) hue-rotate(360deg) saturate(4); } }
  .props .smoke { bottom: 4%; width: 110px; height: 80px; margin-left: -55px; border-radius: 50%; background: radial-gradient(closest-side, rgb(235 230 255 / .9), rgb(190 170 255 / .5) 60%, transparent); filter: blur(6px); }
  .props .pyro { bottom: 6%; width: 16px; height: 120px; margin-left: -8px; transform-origin: 50% 100%; border-radius: 8px 8px 4px 4px; background: linear-gradient(0deg, #fff6c0, #ffb627 30%, #ff5a1f 65%, transparent); filter: blur(1px) drop-shadow(0 0 10px #ff8a1f); }
  .props .title { left: 50%; top: 4%; transform: translateX(-50%); font: 900 30px/1 Impact, 'Anton', system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; color: #fff; background: linear-gradient(180deg, #fff 30%, #ffd84a 55%, #ff8a1f); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; -webkit-text-stroke: 1.5px #2a0f00; filter: drop-shadow(0 3px 0 #1a0a00) drop-shadow(0 0 12px rgb(255 160 40 / .7)); }
  .props .pow { left: 50%; top: 6%; font: 900 22px/1 system-ui, sans-serif; color: #ffd400; -webkit-text-stroke: 2px #1a1020; transform: translateX(-50%); white-space: nowrap; }
  /* a visiting ot: its own little menu (play, say goodbye, settings); feeding, talking and sleep are the host's */
  body.guest .ask, body.guest #gameBtn, body:not(.desktop) #gameBtn, body.guest #talkBtn, body.guest #micBtn, body.guest #sleepBtn { display: none !important; }
  .bye { display: none; }
  body.desktop.guest .bye { display: flex; }
  body.desktop .bubble { max-width: 220px; font-size: 12.5px; padding: 8px 12px; }
  body.desktop .actions { position: absolute; right: auto; left: calc(50% + 70px * var(--pet-scale, 1) - 4px); /* beside the ot at any size: over it, it hid the corners that stretch it */ bottom: 14px; transform: translateX(6px); display: grid; grid-template-columns: repeat(2, 30px); gap: 3px; padding: 4px; /* two columns: one ran taller than the ot */ border-radius: 18px;
    background: color-mix(in srgb, var(--panel) 86%, transparent); border: 1px solid var(--line); box-shadow: var(--shadow); backdrop-filter: blur(10px);
    opacity: 0; transition: none; /* a transition here never finished painting in the transparent window: the menu stayed invisible */ -webkit-app-region: no-drag; z-index: 5; } /* above the 3D stage canvas (z 3) */
  body.desktop.hover .actions, body.desktop.menu .actions { opacity: 1; transform: none; } /* .hover: set by the shell, which sees the cursor even when no mouse event reaches the page (no CSS :hover: it sticks in a click-through window that never gets the mouseleave) */
  body.desktop .act { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 0; background: transparent; }
  body.desktop .act span { display: none; }
  body.desktop .act.primary { background: var(--accent); }
  body.desktop .badge { display: flex; }
  body.listening #micBtn { background: var(--err); color: #fff; animation: rec 1s ease-in-out infinite; }
  @keyframes rec { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--err) 30%, transparent); } }
  body.desktop .ask { display: none; position: absolute; left: 6px; right: 6px; top: 6px; margin: 0; z-index: 4; -webkit-app-region: no-drag; }
  body.desktop.talking .ask { display: flex; }
  .badge { display: none; position: absolute; z-index: 2; left: -6px; bottom: 18px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font: 750 11px/1 var(--font); color: var(--ink); }
  body.desktop .floor { bottom: 0; }
  /* --opaque: a solid card instead of transparency (for Linux setups that paint a box behind the window) */
  body.desktop.opaque { background: var(--panel); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* senses: the camera is on (a small eye, like a webcam light) and what a gesture did */
  .eye { position: absolute; z-index: 2; right: 2px; top: 6px; display: none; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 99px; font: 600 11px/1.4 var(--font, system-ui); background: color-mix(in srgb, var(--panel, #fff) 85%, transparent); color: var(--muted, #8a8399); box-shadow: 0 1px 3px rgb(0 0 0 / .15); pointer-events: none; }
  .eye.on { display: inline-flex; }
  .eye::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #e5484d; }
  .eye.paused::before { background: var(--muted, #8a8399); }
  .eye.armed { color: #fff; background: #6d5dfc; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <span class="brand"><i>7</i>7ots</span>
    <span class="sp"></span>
    <span class="live" id="live"></span>
  </header>

  <section class="hero">
    <div class="stage" id="stage">
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
      <span class="zz" aria-hidden="true">z</span>
      <div class="actor" id="act"><div class="face" id="face"></div></div>
      <div class="props" id="props" aria-hidden="true"></div>
      <div class="floor" aria-hidden="true"></div>
      <span class="badge" id="badge"></span>
      <span class="eye" id="eye" aria-live="polite"></span>
    </div>
    <form class="ask" id="ask" autocomplete="off"><input id="askIn" maxlength="800" enterkeyhint="send"></form>
    <div class="who">
      <h1 id="name"></h1>
      <div class="sub"><span id="role"></span><span class="mood" id="mood"></span><a class="mood cardlink" id="cardBtn" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M12 8.5l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z"/></svg><span data-t="card"></span></a></div>
    </div>
  </section>

  <section class="level" aria-labelledby="lvl">
    <div class="level-h"><b id="lvl"></b><span id="xp"></span></div>
    <div class="track"><span id="xpbar" style="width:0"></span></div>
  </section>

  <section class="stats" id="stats"></section>

  <nav class="actions">
    <button class="act primary" data-act="feed"><svg viewBox="0 0 24 24"><path d="M12 7c-1.5-2.5-6-2.5-7 1.5S7 20 9.5 20c1.2 0 1.6-.6 2.5-.6s1.3.6 2.5.6C17 20 20 12.5 19 8.5S13.5 4.5 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg><span data-t="feed"></span></button>
    <button class="act" id="talkBtn" type="button"><svg viewBox="0 0 24 24"><path d="M5 6h14v9H9l-4 3z"/></svg><span data-t="talk"></span></button>
    <button class="act" id="micBtn" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span data-t="listen"></span></button>
    <button class="act" data-act="sleep" id="sleepBtn"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span data-t="sleep"></span></button>
    <button class="act" id="danceBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></svg><span data-t="dance"></span></button>
    <button class="act" id="gameBtn" type="button"><svg viewBox="0 0 24 24"><path d="M7 8.5h10a4 4 0 0 1 4 4v1.5a3 3 0 0 1-5.4 1.8L14.5 14h-5l-1.1 1.8A3 3 0 0 1 3 14v-1.5a4 4 0 0 1 4-4z"/><path d="M7.5 11v2.5M6.25 12.25h2.5"/></svg><span data-t="game"></span></button>
    <a class="act" id="setBtn" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span data-t="settings"></span></a>

    },
    twist: () => act.animate([{ transform: 'rotate(-12deg) translateX(-6px)' }, { transform: 'rotate(12deg) translateX(6px)' }], { duration: 330, iterations: 10, direction: 'alternate', easing: 'ease-in-out' }),
    shove: (d) => act.animate([{ transform: 'none' }, { transform: `translateX(${d * 24}px) scaleX(1.1)`, offset: 0.4 }, { transform: 'none' }], { duration: 380 }),
  };
  addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.hush) (bubble.classList.remove('on'), clearTimeout(say.t), talk(false)); // the other ot's turn to talk
    if (d.line) {
      showBubble(document.createTextNode(d.line), d.ms || Math.max(2200, d.line.length * 70));
      talk(true, d.line);
      clearTimeout(say.t);
      say.t = setTimeout(() => talk(false), 400 + d.line.length * 55);
    }
    if (d.gesture) ch.gesture(d.gesture, d.gms ? { ms: d.gms } : undefined);
    if (d.effect) ch.effect?.(d.effect);
    if (d.act && ACTS[d.act]) {
      actRoom = d.room || 150;
      actTall = 70;
      actUntil = Date.now() + (d.ms || 3600);
      tellNeed();
      requestAnimationFrame(() => ACTS[d.act](d.dir || 1, d));
    }
    if (d.dance) dance(d.dance);
    if (d.entrance) entrance(d.entrance);
    if (d.face != null) {
      if (is3d) ch.character.yaw = -d.face * 0.9;
      else $('#stage').classList.toggle('flip', d.face < 0);
      lookFree = Date.now() + 1500;
      ch.lookAt?.(d.face * 0.8, 0);
    }
  });

  // ── dances with music, and entrances (POST /dance, /entrance on the daemon; `7ots dance`, `7ots entrance`) ──
  // Music: synthesized at the dance's tempo (beat.js, no copyrighted audio) or one of your own files in ~/.7ots/music.
  const any = (a) => a[Math.floor(Math.random() * a.length)];
  let beat = null;
  let tune = null;
  let danceEnd = 0;
  function stopMusic(fade = 0.4) {
    beat?.stop(fade);
    beat = null;
    if (tune) {
      const a = tune;
      tune = null;
      const v0 = a.volume;
      const t0 = Date.now();
      const f = setInterval(() => {
        const k = Math.min(1, (Date.now() - t0) / (fade * 1000 || 1));
        a.volume = Math.max(0, v0 * (1 - k));
        if (k >= 1) (clearInterval(f), a.pause());
      }, 40);
    }
  }
  function music(m, ms, style) {
    stopMusic(0.2);
    if (!m || guest) return;
    alog(`music ${m.file || m.style || style || 'hype'} ${ms}ms`); // a visitor dances along to the host's music
    const vol = Math.max(0, Math.min(1, m.vol ?? 0.5));
    if (m.file) {
      const a = new Audio(`/music/${encodeURIComponent(m.file)}?token=${encodeURIComponent(BOOT.token)}`);
      a.volume = vol;
      a.play().catch((e) => console.warn('[7ots pet] music:', e?.message || e));
      tune = a;
      setTimeout(() => tune === a && stopMusic(1.2), Math.max(0, ms - 1200));
    } else beat = playBeat?.(m.style || style || 'hype', { ms, volume: vol });
  }
  function dance(d = {}) {
    if (asleep) stir();
    const name = DANCES.includes(d.name) ? d.name : any(DANCES.length ? DANCES : ['dance']);
    const ms = Math.max(1500, Math.min(60000, Number(d.ms) || 8000));
    danceEnd = Date.now() + ms;
    ch.gesture(name, { ms });
    music(d.music, ms, DANCE_STYLE[name]);
  }
  // a wrestling-style entrance: the crowd, two booms with pyro, spotlights, its name slammed in, then a dance
  let entering = 0;
  function entrance(d = {}) {
    if (Date.now() < entering) return;
    const INTRO = 2200; // the music's intro (crowd + booms) before the riff
    const ms = 12000;
    entering = Date.now() + ms;
    stir();
    const kind = ['wwe', 'rock', 'magic'].includes(d.kind) ? d.kind : 'wwe';
    const style = { wwe: 'entrance', rock: 'hype', magic: 'chip' }[kind];
    music(d.music && !d.music.file ? { ...d.music, style } : d.music, ms, style);
    if (desktop) console.debug('§7enter'); // the shell walks it in from the side
    actRoom = 190;
    actTall = 150;
    actUntil = Date.now() + ms;
    tellNeed();
    // walking in under two crossing spotlights
    for (const k of kind === 'magic' ? [] : [-1, 1]) {
      const sp = prop(kind === 'rock' ? 'spot rock' : 'spot');
      gone(sp, sp.animate([{ opacity: 0, transform: `rotate(${k * 28}deg)` }, { opacity: 1, transform: `rotate(${-k * 18}deg)`, offset: 0.25 }, { opacity: 1, transform: `rotate(${k * 12}deg)`, offset: 0.5 }, { opacity: 1, transform: `rotate(${-k * 6}deg)`, offset: 0.75 }, { opacity: 0, transform: 'rotate(0deg)' }], { duration: ms, easing: 'ease-in-out' }));
    }
    ch.gesture('groove', { ms: INTRO + 1800 });
    // pyro on each boom of the music (1.0 s and 1.6 s), both sides
    const pyro = (at) =>
      setTimeout(() => {
        if (kind === 'rock') return ch.effect?.('confetti'), ch.effect?.('notes');
        if (kind === 'magic') {
          for (const x of [-1, 0, 1]) {
            const p = prop('smoke', { left: `calc(50% + ${x * (actRoom - 50)}px)` });
            gone(p, p.animate([{ transform: 'scale(.3)', opacity: 0.9 }, { transform: 'scale(1.6) translateY(-20px)', opacity: 0 }], { duration: 1600, easing: 'ease-out' }));
          }
          return ch.effect?.('sparkles');
        }
        for (const x of [-1, 1]) {
          const p = prop('pyro', { left: `calc(50% + ${x * (actRoom - 30)}px)` });
          gone(p, p.animate([{ transform: 'scaleY(0)', opacity: 1 }, { transform: 'scaleY(1.1)', opacity: 1, offset: 0.25 }, { transform: 'scaleY(.8)', opacity: 0.9, offset: 0.6 }, { transform: 'scaleY(.2)', opacity: 0 }], { duration: 1100, easing: 'ease-out' }));
        }
        const f = prop('flash', { left: '50%', top: '30%' });
        gone(f, f.animate([{ opacity: 1, transform: 'scale(.5)' }, { opacity: 0, transform: 'scale(4)' }], { duration: 500 }));
        ch.effect?.('sparkles');
      }, at);
    pyro(1000);
    pyro(1600);
    // its name, slammed in on the riff
    setTimeout(() => {
      const t = prop('title', {}, String(d.name || id.name || 'ot').slice(0, 24));
      gone(t, t.animate([{ opacity: 0, transform: 'translateX(-50%) scale(2.6)' }, { opacity: 1, transform: 'translateX(-50%) scale(.95)', offset: 0.06 }, { opacity: 1, transform: 'translateX(-50%) scale(1)', offset: 0.1 }, { opacity: 1, transform: 'translateX(-50%) scale(1.04)', offset: 0.85 }, { opacity: 0, transform: 'translateX(-50%) translateY(-10px) scale(1)' }], { duration: ms - INTRO - 600, easing: 'ease-out' }));
      ch.gesture('celebrate');
      ch.effect?.('confetti');
    }, INTRO);
    // arrived: points at the crowd, then dances to the end of the music
    setTimeout(() => (ch.gesture('point'), ch.effect?.('sparkles')), INTRO + 1900);
    setTimeout(() => {
      const name = DANCES.includes(d.dance) ? d.dance : any(DANCES.filter((n) => n !== 'dab' && n !== 'dance'));
      danceEnd = entering;
      ch.gesture(name, { ms: ms - INTRO - 3600 });
    }, INTRO + 3400);
  }
  // an entrance when the pet starts, if the owner turned it on (the server says yes once per run)
  if (!guest) setTimeout(() => post('/entrance', { start: true }).catch(() => {}), 2500);
  $('#danceBtn').title = t('dance');
  if (!guest)
    $('#danceBtn')?.addEventListener('click', () => post('/dance', {}).catch(() => dance({})));
  else $('#danceBtn')?.addEventListener('click', () => dance({}));

  // ── personality: small life between events (glances, fidgets, effects, shape changes) ──
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const SHAPES = ['round', 'egg', 'pear', 'bean', 'squircle', 'drop', 'ghost', 'cat', 'cloud', 'blob', 'heart', 'mushroom', 'tall', 'wide'].filter((x) => x !== spec.shape);
  const weighted = (list) => {
    let r = Math.random() * list.reduce((a, x) => a + x[0], 0);
    for (const x of list) if ((r -= x[0]) <= 0) return x[1];
  };
  function glance() {
    lookFree = Date.now() + 1400 + Math.random() * 1200;
    ch.lookAt((Math.random() * 2 - 1) * 0.8, (Math.random() * 2 - 1) * 0.5);
    if (Math.random() < 0.4) ch.blink?.();
  }
  function fidget() {
    const s = last || {};
    const tired = s.energy < 35;
    const bored = s.fun < 35;
    const hungry = s.food < 35;
    const happy = s.mood === 'happy';
    weighted([
      [5, glance],
      [2, () => ch.gesture('wiggle')],
      [1.5, () => (ch.gesture('think'), ch.effect?.('question'))],
      [1, () => ch.gesture('shrug')],
      [0.6, () => ch.gesture('hiccup')],
      [0.5, () => (ch.gesture('sneeze'), ch.effect?.('sneeze'))],
      [happy ? 2.5 : 0.6, () => (ch.gesture('dance'), ch.effect?.('notes'))],
      [happy ? 0.8 : 0.2, () => ch.gesture(pick(DANCES.length ? DANCES : ['dance']), { ms: 3000 })], // a few silent moves (music only when asked)
      [happy ? 0.8 : 0.2, () => (ch.gesture('celebrate'), ch.effect?.('sparkles'))],
      [0.6, () => ch.gesture('spin')],
      [0.5, () => ch.gesture('clap')],
      [tired ? 3 : 0.4, () => ch.gesture('yawn')],
      [bored ? 1.5 : 0.2, () => (ch.gesture('stomp'), ch.effect?.('steam'))],
      [hungry ? 1.2 : 0, () => (ch.gesture('point'), ch.effect?.('thought'))],
      [0.6, () => ch.effect?.('blush')],
      [0.3, () => ch.gesture('shiver')],
      [1.2, () => ch.morph?.(pick(['puff', 'squish', 'stretch']), { ms: 1600 + Math.random() * 1600 })],
      [0.7, () => ch.morph?.(pick(['wings', 'horns', 'spikes', 'hands']), { ms: 2500 + Math.random() * 2500 })],
      [0.8, () => ch.morph?.(`shape:${pick(SHAPES)}`, { ms: 2500 + Math.random() * 3000 })],
    ])?.();
  }
  (function life() {
    setTimeout(() => {
      if (!asleep && !thinking && !rec && !bubble.classList.contains('on') && !document.hidden && Date.now() > danceEnd) fidget(); // not over a dance
      life();
    }, 4000 + Math.random() * 8000);
  })();
</script>
</body>
</html>
