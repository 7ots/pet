<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7ots settings</title>
<style>
  :root {
    /* Same look as the pet page (/pet) and 7ots.com: soft lilac background, white cards, violet accent. */
    --ink: #17141f; --ink-2: #4a4458; --muted: #8a8399; --bg: #f3f1f8; --panel: #ffffff; --panel-2: #f8f7fb;
    --line: #e8e4f0; --accent: #6d5dfc; --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--panel)); --accent-ink: #fff; --ok: #12a150; --warn: #e08a00; --err: #e5484d;
    --shadow: 0 1px 2px rgb(20 16 40 / .06), 0 12px 40px -12px rgb(20 16 40 / .18);
    --font: ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, system-ui, sans-serif;
    --display: var(--font);
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2f0f8; --ink-2: #c9c3d6; --muted: #8d86a0; --bg: #0f0d14; --panel: #18151f; --panel-2: #1e1a27; --line: #2a2535; --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 18px 50px -16px rgb(0 0 0 / .7); color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; font: 14px/1.5 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  body { padding: 0; min-height: 100vh; }
  .shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; width: min(1080px, 100%); margin: 0 auto; padding: 24px 16px; min-height: 100vh; align-items: start; }
  aside { position: sticky; top: 24px; padding: 0 0 12px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
  aside nav { padding: 0 10px; }
  .me { display: grid; justify-items: center; text-align: center; gap: 2px; padding: 26px 14px 16px; border-bottom: 1px solid var(--line); background: radial-gradient(120% 90% at 50% 30%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
  .me .av { width: 56px; height: 56px; margin-bottom: 8px; border-radius: 18px; box-shadow: var(--shadow); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 18px/1 var(--display); }
  .me .av.drawn { width: 96px; height: 100px; background: none; box-shadow: none; border-radius: 0; margin-bottom: 4px; }
  @media (max-width: 760px) { .me .av.drawn { width: 36px; height: 38px; } }
  .me b { font: 750 18px/1.15 var(--display); letter-spacing: -.025em; }
  .me small { color: var(--muted); font-size: 12px; }
  nav { display: grid; gap: 2px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; color: var(--ink-2); font-weight: 500; text-decoration: none !important; }
  nav a span { width: 20px; display: grid; place-items: center; opacity: .8; }
  nav a[aria-current=page] span { opacity: 1; }
  .ico { flex: none; vertical-align: -3px; }
  .logo-claude { color: #d97757; } .logo-anthropic { color: var(--ink); } .logo-googlegemini { color: #4285f4; } .logo-ollama { color: var(--ink); }
  .opt > label b, .chip { display: inline-flex; align-items: center; gap: 7px; }
  nav a:hover { background: var(--panel-2); }
  nav a[aria-current=page] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
  aside .back { margin-top: 4px; font-size: 12.5px; padding: 10px 20px 0; border-top: 1px solid var(--line); }
  main { width: 100%; padding: 6px 0 60px; display: grid; gap: 16px; align-content: start; }
  .pageH { font: 750 26px/1.15 var(--display); letter-spacing: -.025em; margin: 0; }
  .pageD { margin: 4px 0 6px; color: var(--muted); }
  main > section[hidden] { display: none; }
  main > section > h2:first-child { display: none; } /* the page title says it */
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; gap: 14px; padding: 12px; }
    aside { top: 8px; z-index: 2; padding: 8px 10px; flex-direction: row; align-items: center; gap: 10px; border-radius: 18px; overflow-x: auto; }
    aside nav { padding: 0; }
    .me { padding: 0; background: none; border: 0; } .me small, .me b { display: none; } .me .av { width: 32px; height: 32px; margin: 0; border-radius: 10px; font-size: 15px; box-shadow: none; }
    nav { display: flex; gap: 4px; } nav a { white-space: nowrap; padding: 6px 10px; } nav a b { display: none; }
    aside .back { display: none; }
    main { padding: 4px 4px 50px; }
  }
  .sp { flex: 1; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 20px 22px; }
  h2 { margin: 0 0 2px; font: 750 17px/1.3 var(--display); letter-spacing: -.02em; }
  .hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .now { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
  .now b { color: var(--ink); }

  .opts { display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; padding: 12px 13px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; background: var(--panel-2); }
  .opt:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  .opt.off { opacity: .5; cursor: not-allowed; }
  .opt input { margin: 3px 0 0; accent-color: var(--accent); }
  .opt b { font-weight: 650; }
  .opt > label { cursor: inherit; }
  .opt small { grid-column: 2; color: var(--muted); font-size: 12.5px; }
  .more { grid-column: 2; display: none; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: flex-end; }
  .more .chips { align-self: center; }
  .opt:has(input:checked) .more { display: flex; }
  .vconf { flex-basis: 100%; }
  .vconf > summary { cursor: pointer; color: var(--accent); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .vconf .rows { margin-top: 8px; display: grid; gap: 8px; }
  .vconf .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .vconf a.ext { color: var(--accent); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .total { margin: 0 0 10px; color: var(--ink-2); font: 600 13px var(--mono); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; cursor: pointer; }
  .chip:has(input:checked) { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip input { display: none; }
  /* filter of the inference history: each ot drawn, not a dropdown */
  .otPick { gap: 8px; margin: 6px 0 14px; }
  .otPick + .total { margin: 0 0 10px !important; }
  .otPick .chip { padding: 4px 12px 4px 4px; }
  .otPick .chip.all { padding: 5px 12px; }
  .otPick .face { width: 30px; height: 32px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--line); font-weight: 700; font-size: 13px; overflow: hidden; }
  .otPick .face svg { width: 100%; height: 100%; }
  .chip.off { opacity: .45; cursor: not-allowed; }
  label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); flex: 1 1 180px; }
  input[type=text], input[type=password], input[type=search], select { font: 13px var(--font); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; height: 36px; width: 100%; outline: none; }
  input[type=text]:focus, input[type=password]:focus, input[type=search]:focus, select:focus { border-color: var(--accent); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  button { font: 650 13px var(--font); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; min-height: 36px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
  button:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  button:active { transform: scale(.97); }
  button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: wait; }
  button.x { min-height: 26px; padding: 0 9px; border-radius: 9px; font-weight: 500; color: var(--muted); }
  .msg { font-size: 13px; color: var(--muted); }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .reply { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13.5px; display: none; }

  .sw { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
  .sw:first-of-type { border-top: 0; padding-top: 0; }
  .sw small { color: var(--muted); font-size: 12.5px; grid-column: 1; }
  .tog { grid-row: 1 / span 2; grid-column: 2; position: relative; width: 40px; height: 23px; }
  .tog input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: relative; z-index: 1; }
  .tog span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
  .tog span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .15s; }
  .tog input:checked + span { background: var(--accent); }
  .tog input:checked + span::after { transform: translateX(17px); }
  .tog input:disabled { cursor: not-allowed; }
  .soon { opacity: .6; }
  .tag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 600; background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); vertical-align: 1px; }

  .slider { display: grid; gap: 6px; }
  .slider input { width: 100%; accent-color: var(--accent); }
  .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  ul.list li:first-child { border-top: 0; }
  ul.list li span { flex: 1; overflow-wrap: anywhere; }
  ul.list time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; }
  .rows { display: grid; gap: 8px; }
  .rows + .row { margin-top: 14px; }
  .accHero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%), var(--panel-2); }
  .accHero .mark { width: 76px; height: 76px; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
  .accHero .mark img { width: 100%; height: 100%; border-radius: 0 !important; }
  .accHero h3 { margin: 0 0 4px; font: 750 19px/1.2 var(--display); letter-spacing: -.02em; }
  .accHero p { margin: 0 0 14px; color: var(--ink-2); font-size: 13.5px; }
  .perks { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
  .perks li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
  .accHero button.primary { min-height: 42px; padding: 0 20px; border-radius: 14px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .wait { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .ai-busy { display: flex; align-items: center; gap: 10px; margin: 10px 0; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .ai-busy[hidden] { display: none; }
  .ai-busy .spin { width: 20px; height: 20px; }
  .ai-wait textarea, .ai-wait input[type=text] { background-image: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 22%, transparent), transparent); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; opacity: .7; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .who { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel-2); }
  .who .av { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 750 15px/1 var(--display); flex: none; }
  .who div { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
  .who small { color: var(--muted); font-size: 11.5px; }
  .who b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .com-meta { display: flex; gap: 8px; padding: 0 12px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .com-meta .rt { color: var(--warn); font-weight: 650; }
  .stars { display: flex; gap: 2px; padding: 0 12px; margin-bottom: 6px; }
  .ot .stars button { margin: 0; padding: 0 2px; border: 0; background: none; font-size: 18px; line-height: 1; color: var(--line); cursor: pointer; box-shadow: none; }
  .ot .stars button.on { color: var(--warn); }
  .ot .acts { display: flex; gap: 6px; margin: auto 12px 0; } .ot .acts button { margin: 0; flex: 1; }
  .ot .acts button.icon { flex: 0 0 auto; padding: 6px 8px; }
  .ot .rep { display: flex; gap: 6px; padding: 6px 12px 0; } .ot .rep input { flex: 1; min-width: 0; } .ot .rep button { margin: 0; }
  .ot .st { position: absolute; top: 8px; right: 8px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 650; background: var(--panel-2); border: 1px solid var(--line); }
  .otgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
  .ot { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 0 0 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); overflow: hidden; transition: transform .15s, box-shadow .15s, border-color .15s; }
  .ot:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .ot.cur { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .ot .stage { height: 132px; margin-bottom: 8px; background: radial-gradient(80% 90% at 50% 75%, color-mix(in srgb, var(--c, var(--accent)) 30%, transparent), transparent 70%), color-mix(in srgb, var(--c, var(--accent)) 8%, var(--panel-2)); display: grid; place-items: center; }
  .ot .stage > div { width: 112px; height: 120px; }
  .ot .stage .init { font: 800 34px/1 var(--display); color: var(--c, var(--accent)); }
  .ot b, .ot small { padding: 0 12px; }
  .ot b { font: 700 15px/1.2 var(--display); }
  .ot small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ot .cardlink { position: absolute; right: 8px; top: 8px; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; font-size: 11px; font-weight: 600; text-decoration: none; color: var(--ink); background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--line); }
  .ot .visit { margin-top: 6px; font-size: 12px; }
  .ot .cardlink:hover { border-color: var(--c, var(--accent)); }
  .ot button { margin: auto 12px 0; } .ot small { margin-bottom: 10px; }
  .ot .tag { position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 650; }
  .ot.new { justify-content: center; align-items: center; text-align: center; padding: 16px; border-style: dashed; color: var(--muted); text-decoration: none !important; min-height: 220px; }
  .ot.new .ico { width: 28px; height: 28px; }
  .badge { font-size: 12px; font-weight: 650; color: var(--accent); text-align: center; padding: 6px; }

  details.r { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; }
  details.r > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; padding: 12px 14px 13px; align-items: center; }
  details.r > summary::-webkit-details-marker { display: none; }
  details.r > summary::before { content: '›'; color: var(--muted); transition: transform .15s; grid-row: 1 / span 2; }
  details.r[open] > summary::before { transform: rotate(90deg); }
  details.r .sum { font-size: 13.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  details.r .meta { grid-column: 2 / span 2; color: var(--muted); font: 11.5px/1.5 var(--mono); }
  details.r time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  details.r .body { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; }
  details.r .body b { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  pre { margin: 0; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--ink-2); }
  .bad { color: var(--err); }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .sub { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; grid-column: 1 / span 2; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .sub select { width: auto; height: 30px; padding: 0 8px; }
  .sub button { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
  .sh { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sh:first-of-type { margin-top: 4px; }
  .sh input { width: 150px; height: 28px; font-size: 12px; letter-spacing: 0; text-transform: none; }
  ul.list li .kind { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; flex: none; }
  ul.list li small { color: var(--muted); font-size: 12px; }
  table.ps { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.ps th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.ps td { padding: 6px 8px; border-bottom: 1px dashed var(--line); vertical-align: top; }
  table.ps td.n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  table.ps .cmd { font: 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; max-width: 520px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  table.ps tr:hover .cmd { -webkit-line-clamp: 6; }
  table.ps tr.hot td.n:first-of-type { color: var(--warn); font-weight: 650; }
  .bar { display: inline-block; width: 46px; height: 4px; border-radius: 9px; background: var(--line); vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  textarea { font: 13px/1.45 var(--font); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; width: 100%; min-height: 40px; resize: vertical; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .more [hidden], .integ [hidden] { display: none !important; }
  .integ { display: grid; gap: 8px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); margin-bottom: 8px; }
  .integ > header { display: flex; align-items: center; gap: 10px; }
  .integ > header b { flex: 1; display: inline-flex; align-items: center; gap: 8px; font-weight: 650; }
  .integ .tog { grid-row: auto; grid-column: auto; flex: none; }
  .integ small { color: var(--muted); font-size: 12.5px; }
  .integ details > summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  .integ details .rows { margin-top: 8px; }
  .integ .vm { display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
  .sw .kinds { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; }
  .integ .vm b { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .brands { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; margin-top: 4px; }
  .brand { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; border: 1px solid var(--line); border-radius: 99px; font-size: 12px; color: var(--ink); text-decoration: none; background: var(--panel); }
  .brand:hover { border-color: var(--accent); }
  .brand svg:last-child { opacity: .55; }
  .kindpick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
  .kindpick small { color: var(--muted); font-size: 12.5px; margin-right: 4px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { font-size: 12.5px; padding: 5px 10px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .integ .where { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .integ .where .kind { display: inline-flex; align-items: center; gap: 4px; flex: none; padding: 1px 8px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 11px; font-weight: 600; }
  .integ .where code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
  .fields .or { align-self: center; color: var(--muted); font-size: 12px; padding-top: 16px; }
  .testout { white-space: pre-wrap; max-height: 220px; overflow: auto; font-size: 12px; margin: 0; }
  .fields { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  footer { color: var(--muted); font-size: 12px; text-align: center; }
  footer code { font: 11.5px var(--mono); }
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="me"><span class="av" id="av">7</span><b id="title"></b><small id="petLine"></small></div>
  <nav id="nav" aria-label="Settings"></nav>
  <a id="back" class="back"></a>
</aside>
<main>
  <div><h1 class="pageH" id="pageH"></h1><p class="pageD" id="pageD"></p></div>

  <section aria-labelledby="hAcc">
    <h2 id="hAcc" data-t="accH"></h2>
    <p class="hint" data-t="accHint"></p>
    <div id="acc"></div>
    <div class="fields" id="langs" style="margin-top:14px"></div>
    <div class="row"><span class="msg" id="accMsg" role="status"></span></div>
  </section>

  <section aria-labelledby="hBrain">
    <h2 id="hBrain" data-t="brainH"></h2>
    <p class="hint" data-t="brainHint"></p>
    <div class="opts" id="brains"></div>
    <div class="row">
      <button class="primary" id="saveBrain" data-t="save"></button>
      <button id="test" data-t="test"></button>
      <span class="now" id="now"></span>
      <span class="msg" id="brainMsg" role="status"></span>
    </div>
    <div class="reply" id="reply"></div>
  </section>

  <section aria-labelledby="hVoice">
    <h2 id="hVoice" data-t="voiceH"></h2>
    <p class="hint" data-t="voiceHint"></p>
    <div id="vExpr"></div>
    <div class="opts" id="voices"></div>
    <div class="row">
      <button class="primary" id="saveVoice" data-t="save"></button>
      <span class="now" id="stt"></span>
      <span class="msg" id="voiceMsg" role="status"></span>
    </div>
  </section>

  <section aria-labelledby="hAccess">
    <h2 id="hAccess" data-t="accessH"></h2>
    <p class="hint" data-t="accessHint"></p>
    <div id="access"></div>
  </section>

  <section aria-labelledby="hInteg">
    <h2 id="hInteg" data-t="integH"></h2>
    <p class="hint" data-t="integHint"></p>
    <div id="integ"></div>
  </section>

  <section aria-labelledby="hPet">
    <h2 id="hPet" data-t="petH"></h2>
    <p class="hint" data-t="annoyHint"></p>
    <div class="slider">
      <input type="range" id="annoy" min="0" max="3" step="1" aria-labelledby="hPet">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="row">
      <span class="msg" data-t="view"></span>
      <div class="chips" id="view"></div>
      <span class="msg" id="petMsg" role="status"></span>
    </div>
    <h3 class="sh" data-t="scH"></h3>
    <p class="hint" data-t="scHint"></p>
    <p class="hint" id="scVisitor" data-t="scVisitor" hidden></p>
    <div class="row" id="scConf">
      <label class="chip"><input type="checkbox" id="scOn"> <span data-t="scOn"></span></label>
      <div class="chips" id="scEvery"></div>
    </div>
    <div class="chips" id="scList"></div>
    <div class="row">
      <button type="button" id="scPlay" data-t="scPlay"></button>
      <span class="msg" id="scMsg" role="status"></span>
    </div>
    <h3 class="sh" data-t="muH"></h3>
    <p class="hint" data-t="muHint"></p>
    <div class="row">
      <div class="chips" id="muMode"></div>
      <input type="range" id="muVol" min="0" max="1" step="0.05" style="max-width:10rem" aria-label="volume">
    </div>
    <p class="hint" id="muFiles"></p>
    <div class="row">
      <label class="chip"><input type="checkbox" id="enOn"> <span data-t="enOn"></span></label>
      <div class="chips" id="enKind"></div>
      <select id="enDance" aria-label="dance"></select>
    </div>
    <div class="row">
      <button type="button" id="muDance" data-t="muDance"></button>
      <button type="button" id="muEnter" data-t="muEnter"></button>
      <span class="msg" id="muMsg" role="status"></span>
    </div>
    <h3 class="sh" data-t="modsH"></h3>
    <p class="hint" data-t="modsHint"></p>
    <div id="mods"></div>
    <h3 class="sh" data-t="charH"></h3>
    <p class="hint" data-t="charHint"></p>
    <div id="char"></div>
  </section>

  <section aria-labelledby="hWal">
    <h2 id="hWal" data-t="walH"></h2>
    <p class="hint" data-t="walD"></p>
    <div id="wallet"></div>
  </section>

  <section aria-labelledby="hCom">

  // A chara_card_v2 (or v1/v3) from a JSON file or a PNG's "chara"/"ccv3" text chunk.
  async function readCard(file) {
    const buf = new Uint8Array(await file.arrayBuffer());
    if (buf[0] === 0x89 && buf[1] === 0x50) {
      const found = {};
      for (let p = 8; p + 8 <= buf.length;) {
        const len = ((buf[p] << 24) | (buf[p + 1] << 16) | (buf[p + 2] << 8) | buf[p + 3]) >>> 0;
        const type = String.fromCharCode(...buf.subarray(p + 4, p + 8));
        if (type === 'tEXt') {
          const data = buf.subarray(p + 8, p + 8 + len);
          const z = data.indexOf(0);
          const kw = String.fromCharCode(...data.subarray(0, z));
          if (kw === 'chara' || kw === 'ccv3') {
            const b64 = Array.from(data.subarray(z + 1), (c) => String.fromCharCode(c)).join('');
            found[kw] = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))));
          }
        }
        if (type === 'IEND') break;
        p += 12 + len;
      }
      if (!found.chara && !found.ccv3) throw new Error('card');
      return found.chara || found.ccv3;
    }
    return JSON.parse(new TextDecoder().decode(buf));

      }
    });
    const exp = el('button', {}, ico('download', 15), ' ', t('exportCard'));
    exp.addEventListener('click', () => {
      const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(sheetToCard(sheet()), null, 2)], { type: 'application/json' })), download: `${(S.name || 'ot').replace(/[^\w-]+/g, '_')}.chara_card_v2.json` });
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    // Letta: the persona in a Letta agent's core memory (optional)
    const lt = ch.letta || {};
    const agent = el('input', { type: 'text', value: lt.agentId || '', placeholder: 'agent-…', autocomplete: 'off' });
    const lkey = keyField('LETTA_API_KEY', t('lettaKey'));
    const sync = el('button', {}, ico('refresh-cw', 15), ' ', t('lettaSync'));
    sync.addEventListener('click', async () => {
      sync.disabled = true;
      try {
        const k = lkey.querySelector('input').value.trim();
        S = await api('/config', { character: { ...sheet(), letta: { on: true, agentId: agent.value.trim() } }, ...(k ? { keys: { LETTA_API_KEY: k } } : {}) });
        const r = await api('/character/letta', {});
        S = await api('/config');
        renderChar();
        flash($('#charMsg'), r.created ? t('lettaNew') : t('lettaOk'));
      } catch (e) {
        flash(msg, t('err', { e: errText(e) }), 'err');
      } finally {
        sync.disabled = false;
      }
    });
    const letta = card(ico('notebook-pen', 18), t('lettaH'), t('lettaD'), toggle(lt.on, (on) => save({ character: { letta: { on, agentId: agent.value.trim() } } }, msg), t('lettaH')),
      el('div', { className: 'fields' }, field(t('lettaAgent'), agent), lkey, sync));
    msg.id = 'charMsg';
    $('#char').replaceChildren(el('div', { className: 'rows' }, ...fields), el('div', { className: 'row' }, idea, aiLang, ai), busy, el('div', { className: 'row' }, ok, imp, exp, file, msg), el('div', { style: 'margin-top:14px' }, letta));
  }

  // ── language of this page (and of the ot's settings) ──
  function renderLang() {
    const opts = (cur, list) => list.map(([v, n]) => el('option', { value: v, textContent: n, selected: (cur || '') === v }));
    const NAMES = [['en', 'English'], ['es', 'Español'], ['pt', 'Português']];
    const ui = el('select', {}, ...opts(S.configLang, [['', t('langAuto')], ...NAMES]));
    ui.onchange = async () => {
      await save({ lang: ui.value }, $('#accMsg'));
      location.reload();
    };
    const ot = el('select', {}, ...opts(S.lang, NAMES));
    ot.onchange = async () => {
      ot.disabled = true;
      try {
        await api('/identity/lang', { lang: ot.value });
        flash($('#accMsg'), t('saved'));
      } catch (e) {
        flash($('#accMsg'), t('err', { e: errText(e) }), 'err');
      } finally {
        ot.disabled = false;
      }
    };
    $('#langs').replaceChildren(field(t('langLabel'), ui), field(t('otLang', { name: S.name || 'ot' }), ot));
  }
  const errText = (e) => (T[lang][`e_${e.message}`] || T.en[`e_${e.message}`] ? t(`e_${e.message}`) : e.message);

  async function save(body, msg, okText = t('saved')) {
    try {
      S = await api('/config', body);
      flash(msg, okText);
    } catch (e) {
      flash(msg, t('err', { e: errText(e) }), 'err');
    }
  }

  // ── notes + reminders ──
  const fmt = (ms) => new Date(ms).toLocaleString(lang, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  function renderLists() {
    const notes = S.notes.slice().reverse();
    $('#notes').replaceChildren(...(notes.length ? notes.map((n) => {
      const x = el('button', { className: 'x', textContent: t('forget') });
      x.addEventListener('click', async () => {
        await api('/notes/forget', { at: n.at });
        refresh();
      });
      return el('li', {}, el('span', { textContent: n.text }), n.at ? el('time', { textContent: fmt(n.at) }) : null, x);
    }) : [el('li', { className: 'empty', textContent: t('noNotes') })]));
    $('#forgetAll').hidden = !notes.length;
  }
  // ── processes: what the pet runs (reminders, alerts, the screen) and what runs on this computer ──
  const ago = (ms) => {
    const m = Math.round((Date.now() - ms) / 60000);
    return m < 60 ? `${m}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`;
  };
  const money = (n) => Number(n).toLocaleString(lang, { maximumFractionDigits: n < 1 ? 6 : 2 });
  let P = null;
  async function loadProcesses() {
    try {
      P = await api('/processes');
    } catch {
      return;
    }
    const cancel = (path, id) => {
      const x = el('button', { className: 'x', textContent: t('cancel') });
      x.addEventListener('click', async () => (await api(path, { id }), loadProcesses()));
      return x;
    };
    const items = [
      ...P.reminders.map((r) => el('li', {}, el('span', { className: 'kind' }, ico('alarm-clock', 16)), el('span', {}, r.text + (r.open ? `  → ${new URL(r.open).host}` : ''), el('br'), el('small', { textContent: `${t('remind')} · ${fmt(r.at)}` })), cancel('/reminders/cancel', r.id))),
      ...P.watchers.map((w) => {
        const price = w.kind === 'price';
        const what = price ? t('priceW', { coin: w.coin, op: w.op, value: money(w.value), vs: w.vs.toUpperCase() }) : t('procW', { m: w.match, until: t(w.until === 'start' ? 'untilStart' : 'untilExit') });
        const now = price ? (w.last?.price != null ? t('priceNow', { p: money(w.last.price) }) : '…') : w.last ? t(w.last.present ? 'running' : 'notRunning') : '…';
        return el('li', {}, el('span', { className: 'kind' }, ico(price ? 'trending-up' : 'terminal', 16)), el('span', {}, what, el('br'), el('small', { textContent: `${now}${w.text ? ` · ${w.text}` : ''}` })), cancel('/watchers/cancel', w.id));
      }),
    ];
    if (P.screen.on) items.push(el('li', {}, el('span', { className: 'kind' }, ico('eye', 16)), el('span', {}, t('screenEvery', { n: P.screen.every }), P.screen.last ? el('br') : null, P.screen.last ? el('small', { textContent: t('lastSeen', { what: P.screen.last.doing || '' }) }) : null)));
    $('#rems').replaceChildren(...(items.length ? items : [el('li', { className: 'empty', textContent: t('noRems') })]));
    renderPs();
  }
  // Only what the ot itself watches or set up. Without "Processes and apps" it can't wait for a program: say so
  // when it was asked to.
  function renderPs() {
    const box = $('#ps');
    if (!P || P.system || !P.watchers.some((w) => w.kind === 'process')) return box.replaceChildren();
    const on = el('button', { className: 'primary', textContent: t('psOn') });
    on.addEventListener('click', async () => (await save({ access: { processes: true } }, $('#accessMsg')), renderAccess(), loadProcesses()));
    box.replaceChildren(el('p', { className: 'empty' }, t('psOff', { name: S.name }), ' '), on);
  }

  let armed = false;
  $('#forgetAll').addEventListener('click', async (e) => {
    if (!armed) {
      armed = true;
      e.target.textContent = t('sure');
      setTimeout(() => ((armed = false), (e.target.textContent = t('forgetAll'))), 4000);
      return;
    }
    armed = false;
    e.target.textContent = t('forgetAll');
    await api('/notes/forget', { at: 'all' });
    refresh();
  });

  async function refresh(all = false) {
    S = await api('/config');
    if (all) {
      document.title = t('title', { name: S.name });
      $('#title').textContent = S.name;
      await loadMemory();
      renderBrains();
      renderVoices();
      renderAccess();
      renderPet();
      renderScenes();
      renderMusic();
      renderMods();
      renderChar();
      renderLang();
      renderMemTabs();
      go();
    } else loadMemory();
    const pv = M?.pet;
    if (pv) $('#petLine').textContent = `${t('lv')} ${pv.level} · ${word(pv.mood)}${pv.asleep ? ' · 💤' : ''}`;
    if (!$('#av svg')) $('#av').textContent = (S.name || '7')[0].toUpperCase();
    renderLists();
    loadInferences();
    if (location.hash === '#rem') loadProcesses();
  }
  refresh(true);
  setInterval(() => document.visibilityState === 'visible' && refresh(), 15000); // reminders fire, notes get added
</script>
</body>
</html>
